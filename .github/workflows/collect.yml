name: collect-stats

on:
  schedule:
    # 매일 00:05 / 09:05 UTC = 한국시간 09:05 / 18:05
    - cron: "5 0,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vercel 방문 통계 조회
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ZGSciMpd42omICu2wdjqVnrO9jvT
          TEAM_ID: team_tdCVpvSteWKP2th50AFFHTYn
        run: node collect.js

      - name: 바뀌었을 때만 커밋
        run: |
          git config user.name "hwp-stats bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --staged --quiet; then
            echo "변화 없음 — 커밋하지 않음"
          else
            git commit -m "stats: $(date -u '+%Y-%m-%d %H:%M')Z"
            git push
          fi
